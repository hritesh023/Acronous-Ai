# Cloudflare Tunnel Configuration — Named Tunnel for Persistence
# Run this on Contabo VPS server to get a FIXED tunnel URL
#
# SETUP (one-time):
#   1. Install cloudflared on Contabo VPS:
#      curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64 -o /usr/local/bin/cloudflared
#      chmod +x /usr/local/bin/cloudflared
#
#   2. Authenticate with Cloudflare:
#      cloudflared tunnel login
#
#   3. Create a named tunnel:
#      cloudflared tunnel create acronous-contabo
#
#   4. Copy this config:
#      cp cloudflared-config.yml /root/.cloudflared/config.yml
#
#   5. Route DNS to the tunnel:
#      cloudflared tunnel route dns acronous-contabo brain.acronous.com
#
#   6. Run the tunnel:
#      cloudflared tunnel run --config /root/.cloudflared/config.yml
#
#   7. To run as a service (auto-restart on reboot):
#      cloudflared service install
#      systemctl enable cloudflared
#      systemctl start cloudflared

tunnel: acronous-contabo
# Credentials file is auto-generated by `cloudflared tunnel create`
# Located at: /root/.cloudflared/<TUNNEL_ID>.json
# If not in default path, set the full path:
# credentials-file: /root/.cloudflared/<TUNNEL_ID>.json

ingress:
  # NOTE: this file is a TEMPLATE. The live tunnel (acronous-contabo) is
  # remotely managed — the real ingress lives in the Cloudflare dashboard
  # (PUT /cfd_tunnel/<id>/configurations) and currently is:
  #   brain.acronous.com /v1/*      → http://brain:8000   (FastAPI brain)
  #   brain.acronous.com            → http://nginx:80     (web UI / fallbacks)
  #   ollama.acronous.com           → http://ollama:11434 (LLM, OpenAI-compat)
  #   brain-ollama.acronous.com     → http://ollama:11434 (alias)
  #   image-service.acronous.com    → http://image-service:7860
  #   search.acronous.com           → http://searxng:8080
  #   brain-ui.acronous.com         → http://nginx:80
  # Use docker service names (not localhost) — cloudflared runs in compose.
  - hostname: brain.acronous.com
    service: http://nginx:80
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      timeout: 600s

  # Python image service (matches EDITOR_SERVICE_URL=https://image-service.acronous.com
  # in Acronous Ai wrangler.toml — this hostname was missing entirely).
  - hostname: image-service.acronous.com
    service: http://localhost:7860
    originRequest:
      noTLSVerify: true
      connectTimeout: 120s
      timeout: 300s

  # SearXNG search engine
  - hostname: search.acronous.com
    service: http://localhost:8080
    originRequest:
      connectTimeout: 15s
      timeout: 30s

  # Ollama API direct (OpenAI-compat /v1/chat/completions + native /api/chat)
  - hostname: ollama.acronous.com
    service: http://localhost:11434
    originRequest:
      connectTimeout: 30s
      timeout: 600s

  # Nginx (web UI / static files)
  - hostname: brain-ui.acronous.com
    service: http://localhost:80
    originRequest:
      connectTimeout: 10s
      timeout: 30s

  # Catch-all: return 404 for unmatched routes
  - service: http_status:404
