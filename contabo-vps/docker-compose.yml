# Acronous LLM brain — Contabo Cloud VPS 8 (24GB RAM / 300GB disk, EU, 167.86.104.155)
# MEMORY BUDGET (limits sum ≈ 18.5GB — OS + Docker keep ~5.5GB headroom, never OOM):
#   ollama 10g + brain 3g + image-service 3g + api-server 1g + dashboard 512m + searxng 512m + nginx/cloudflared ~384m
# DISK BUDGET (300GB): models ~40GB + images ~15GB + data/db ~10GB + training quota 25GB
#   → ~90GB used, ~200GB+ always free. Self-train enforces its quota + 40GB free floor.
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-build:/usr/share/nginx/html:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - api-server
      - brain
      - image-service
      - searxng
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - acronous-net

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - PORT=3000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3.5:2b
      - OLLAMA_FAST_MODEL=qwen3.5:2b
      - OLLAMA_CODE_MODEL=qwen3.5:4b
      # MUST match OLLAMA_CONTEXT_LENGTH on the ollama service: any mismatch
      # forces a KV-cache reallocation worth 8-15s on this box.
      - OLLAMA_CONTEXT_SIZE=2048
      - OLLAMA_VISION_MODEL=qwen3.5:4b
      - EDITOR_SERVICE_URL=http://image-service:7860
      - SEARXNG_URL=http://searxng:8080
      - ACRONOUS_BRAIN_URL=http://brain:8000
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - acronous-net

  # ── Acronous LLM shared brain (FastAPI): chat/learn + internet learning
  # (5-min quick-scan) + resource-safe self-train (6h dataset cycle).
  # Gets smarter daily WITHOUT growing disk: merged dataset capped,
  # snapshots pruned, RAM/disk guards skip cycles under pressure.
  brain:
    build:
      context: ../acronous_llm
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ACRONOUS_LLM_PROVIDER=contabo
      - ACRONOUS_LLM_API_URL=http://ollama:11434/v1
      - ACRONOUS_LLM_MODEL=qwen3.5:2b
      - ACRONOUS_LLM_CHAT_MODEL=qwen3.5:2b
      - ACRONOUS_LLM_CODE_MODEL=qwen3.5:4b
      - ACRONOUS_LLM_FAST_MODEL=qwen3.5:2b
      - ACRONOUS_VISION_MODEL=qwen3.5:4b
      # One context size, one slot, one resident model. Deadline-bounded
      # generation so a degenerate loop can never eat the whole box again.
      - ACRONOUS_LLM_CONTEXT_SIZE=2048
      - ACRONOUS_LLM_NUM_PARALLEL=1
      - ACRONOUS_LLM_DEADLINE_S=75
      - ACRONOUS_LLM_DEADLINE_FIRST_TOKEN_S=30
      - ACRONOUS_LLM_REPEAT_PENALTY=1.2
      - ACRONOUS_BRAIN_HOST=brain.acronous.com
      - ACRONOUS_BRAIN_DIRECT_URL=http://167.86.104.155:11434
      - ACRONOUS_SELF_TRAIN=true
      - ACRONOUS_SELF_TRAIN_INTERVAL=21600
      - ACRONOUS_SELF_TRAIN_MIN_FACTS=500
      - ACRONOUS_SELF_TRAIN_MAX_RAM_PCT=85
      - ACRONOUS_SELF_TRAIN_MIN_FREE_GB=40
      - ACRONOUS_SELF_TRAIN_MAX_TRAIN_GB=25
      - ACRONOUS_SELF_TRAIN_MAX_PAIRS_PER_CYCLE=400
      - ACRONOUS_SELF_TRAIN_MAX_MERGED_PAIRS=20000
      - ACRONOUS_SELF_TRAIN_RETAIN_DAYS=14
      - ACRONOUS_SELF_TRAIN_RETAIN_SNAPSHOTS=7
      # ── Fast-RAG v2 (small-box accuracy without the wait) ──
      # Hybrid BM25 + dense retrieval fused with RRF, behind a confidence
      # gate: confident hits answer by extraction (0 LLM calls, ~5-20ms),
      # weak hits fall through to the LLM instead of guessing.
      - ACRONOUS_RAG_MAX_DOCS=6000
      - ACRONOUS_RAG_SAVE_DEBOUNCE_S=45
      - ACRONOUS_RAG_TOP_K=4
      - ACRONOUS_RAG_CHUNK_CHARS=320
      - ACRONOUS_RAG_CHUNK_OVERLAP=60
      - ACRONOUS_RAG_DIRECT_ANSWER=0.72
      - ACRONOUS_RAG_CACHE_TTL_S=1800
      - ACRONOUS_RAG_MIN_TERMS=2
      # Regex-only routing (no LLM classify call) + 900ms search cap.
      - ACRONOUS_ROUTER_LLM_CLASSIFY=false
      - ACRONOUS_SEARCH_PHASE_MS=700
      - ACRONOUS_SEARCH_MAX_RESULTS=3
      - ACRONOUS_MEMORY_MAX_PER_SESSION=200
      - ACRONOUS_MEMORY_MAX_ROWS=20000
      - DATA_DIR=/data/brain
    volumes:
      - ./data/brain:/data/brain
      - ollama_data:/root/.ollama:ro
    restart: unless-stopped
    mem_limit: 3g
    networks:
      - acronous-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/v1/brain/info',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  image-service:
    build:
      context: ../image-service
      dockerfile: Dockerfile
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_VISION_MODEL=llava:7b
      - PORT=7860
    ports:
      - "7860:7860"
    restart: unless-stopped
    mem_limit: 3g
    networks:
      - acronous-net

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-acronous-searxng-secret-2024}
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - acronous-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Private dev-only dashboard (dashboard.acronous.com) ──
  # Next.js standalone. Internal port only — exposed SOLELY via the
  # Cloudflare Tunnel ingress below, never published on the host.
  # Requires ~/Acronous-Dashboard/.env on the VPS (ADMIN_EMAIL/HASH/SESSION_SECRET).
  dashboard:
    build:
      context: ../Acronous-Dashboard
      dockerfile: Dockerfile
    env_file:
      - ../Acronous-Dashboard/.env
    environment:
      - PORT=3000
      - BRAIN_URL=http://brain:8000
      - API_URL=https://api.acronous.com
      - OLLAMA_URL=http://ollama:11434
      - VPS_METRICS_URL=http://vps-monitor:9100/metrics
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - acronous-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── VPS monitor (private metrics for dashboard.acronous.com) ──
  # Stdlib-only Python. Internal port only; token-guarded /metrics.
  vps-monitor:
    build:
      context: ./vps-monitor
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - acronous-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # ── Latency contract (measured on this 4-core CPU box) ──────────────
      # NUM_PARALLEL=1 + a single pinned CONTEXT_LENGTH is the single biggest
      # speed win available. Ollama allocates the KV cache per slot, so with
      # 4 slots ANY caller that changed num_ctx forced a full reallocation of
      # the whole cache: measured 8-15s of pure prefill per context switch,
      # and 4x the KV memory, which also halved decode throughput.
      # One slot + one context size = warm cache, ~0.2s TTFT, ~40 tok/s.
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_CONTEXT_LENGTH=2048
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=64
      # q8_0 KV halves KV memory and lowers attention bandwidth on CPU.
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_FLASH_ATTENTION=1
    restart: unless-stopped
    mem_limit: 8g
    networks:
      - acronous-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --config /etc/cloudflared/config.yml
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - acronous-net

volumes:
  ollama_data:

networks:
  acronous-net:
    driver: bridge
