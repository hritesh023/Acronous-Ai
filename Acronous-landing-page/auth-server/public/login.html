<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Acronous</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="card">
    <div class="logo"><img src="/logo.png" alt="Acronous"></div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to access all Acronous apps</p>
    <div id="error" class="error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>
    <p class="footer-text">
      Don't have an account? <a href="/signup">Sign Up</a>
    </p>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const error = document.getElementById('error');
    const btn = document.getElementById('submitBtn');
    const params = new URLSearchParams(location.search);
    const redirect = params.get('redirect') || '/dashboard';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.classList.remove('show');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Signing in...';
      try {
        const res = await fetch('/api/auth/login-redirect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value, password: password.value, redirect }),
        });
        if (res.redirected) {
          window.location.href = res.url;
        } else {
          const data = await res.json();
          throw new Error(data.error || 'Login failed');
        }
      } catch (err) {
        error.textContent = err.message;
        error.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
