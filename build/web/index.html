<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Acronous AI - AI Chat Assistant">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Acronous AI">
  <meta name="theme-color" content="#111118">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Acronous AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="sitemap" type="application/xml" href="sitemap.xml">
  <style>
    /* Full-viewport flexible shell: fills phones, foldables, tablets,
       desktops and external displays; respects notches/cutouts. */
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    html, body { min-height: 100vh; min-height: 100dvh; width: 100%; }
    body {
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      overscroll-behavior-y: none;
      background: #111118;
    }
  </style>
</head>
<body>
  <script>
  /* AcronousPay — web bridge for in-app Razorpay checkout (called from Dart
     via dart:js_interop; checkout.js is loaded lazily so normal page loads
     stay fast). Secrets never appear here: the server created the order. */
  window.AcronousPay = {
    ensure: function (cb) {
      if (window.Razorpay) { cb(null); return; }
      var s = document.createElement('script');
      s.src = 'https://checkout.razorpay.com/v1/checkout.js';
      s.onload = function () { cb(null); };
      s.onerror = function () { cb(new Error('load')); };
      document.head.appendChild(s);
    },
    open: function (opts, onOk, onErr) {
      this.ensure(function (e) {
        if (e || !window.Razorpay) { onErr({ message: 'Could not load the payment gateway. Check your connection and retry.' }); return; }
        try {
          var rzp = new window.Razorpay({
            key: opts.key, amount: opts.amount, currency: opts.currency || 'INR',
            name: 'Acronous', description: opts.description || 'Plan',
            order_id: opts.order_id, theme: { color: opts.color || '#6366f1' },
            modal: { ondismiss: function () { onErr({ cancelled: true }); } },
            handler: function (r) { onOk(r); }
          });
          rzp.on('payment.failed', function (r) {
            onErr({ message: (r && r.error && r.error.description) || 'Payment failed. No money was deducted for a failed payment.' });
          });
          rzp.open();
        } catch (err) { onErr({ message: String(err) }); }
      });
    }
  };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
