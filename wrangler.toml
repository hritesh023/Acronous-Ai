name = "acronous-ai"
compatibility_date = "2026-07-04"
main = "cloudflare-worker.js"

# Worker routes - use separate subdomain for API
routes = [
  { pattern = "api.acronous.com", custom_domain = true },
  { pattern = "ai.acronous.com/*", zone_name = "acronous.com" },
]

[vars]
# ── Model routing (measured on Contabo 4-core CPU, 2026-09) ────────────────
# qwen3.5 (hybrid Gated-DeltaNet) is both faster and smarter than the qwen2.5
# line at the same footprint. Steady-state, single slot, pinned 4096 ctx:
#   qwen3.5:2b  TTFT 0.4-1.6s   ~31-34 tok/s   -> default chat (2x faster)
#   qwen3.5:4b  TTFT 1.5-2.3s   ~15-18 tok/s   -> code / deep answers
#   qwen2.5:3b  ~28 tok/s                      -> legacy fallback
# The default is the 2B because on a CPU box GENERATION time, not quality, is
# what the user feels: at 31 tok/s a 500-token answer takes 16s, at 15 tok/s it
# takes 33s. The 4B is used where quality per token matters (code, research).
# MUST be thinking-disabled at the call site (`think:false`) — qwen3.5 defaults
# to emitting a reasoning block and returns empty content without it.
OLLAMA_MODEL = "qwen3.5:2b"
OLLAMA_FAST_MODEL = "qwen3.5:2b"
OLLAMA_CODE_MODEL = "qwen3.5:4b"
OLLAMA_VISION_MODEL = "qwen2.5vl:7b"
# Pinned to match OLLAMA_CONTEXT_LENGTH on the VPS ollama container. A
# mismatch makes Ollama reallocate the entire KV cache (measured 8-15s of
# dead prefill per switch) — this single value is worth more than any model
# upgrade for perceived speed.
OLLAMA_CONTEXT_SIZE = "4096"
ENABLE_WEB = "true"
ENABLE_VISION = "true"
ENABLE_VOICE = "true"
PAGES_ORIGIN = "https://acronous-ai.pages.dev"
# Python image editing service URL - Cloudflare Tunnel to Contabo VPS
# Tunnel routes image-service.acronous.com  localhost:7860
EDITOR_SERVICE_URL = "https://image-service.acronous.com"
# ── Shared Acronous LLM brain (RAG + self-learning) ───────────────────────
# Same VPS, reached over the Cloudflare Tunnel. Provides the RAG fast path
# (confident memory hits answer with zero LLM calls) and receives every turn
# as human-eval training signal.
BRAIN_URL = "https://brain.acronous.com"
RAG_ENABLED = "true"

# ── GPU fast-path (RunPod Serverless) — DISABLED, must stay disabled ──
# Policy: free + unlimited, self-hosted resources only. RunPod is a paid,
# metered service, so it is hard-disabled below. The code path is retained
# behind GPU_ENABLED so it can never engage by accident. Do not set
# GPU_LLM_URL / GPU_IMAGE_URL without an explicit decision.
GPU_ENABLED = "false"
# GPU_LLM_URL = ""                 # e.g. https://api.runpod.ai/v2/<llm-endpoint-id>
# GPU_LLM_MODEL = "qwen3.5:4b"     # model served by your vLLM serverless template
# GPU_LLM_TIMEOUT_MS = "60000"     # GPU attempt budget; cold start ~15-30s, warm ~2-5s
# GPU_IMAGE_URL = ""               # e.g. https://api.runpod.ai/v2/<image-endpoint-id>
# GPU_IMAGE_TIMEOUT_MS = "110000"  # image cold start can take ~20-40s
# NOTE: GPU_LLM_KEY / GPU_IMAGE_KEY are secrets — set with:
#   npx wrangler secret put GPU_LLM_KEY
#   npx wrangler secret put GPU_IMAGE_KEY

# ── Metering + paywall (Razorpay; all caps per user per day, UTC) ──
# Full multi-tier catalog lives in code (BILLING_CATALOG in cloudflare-worker.js,
# mirrored in Acronous-landing-page/billing/plans.json):
#   AI: starter 149 / plus 449* / pro 999 / ultra 2499 | Nav AI: 99 / 299* / 699 / 1499
#   Equyvo: plus 49 / premium 149* / creator 399* / creator_pro 799 | One bundle 699
#   API packs (one-time credits): 99->1k / 499->6k / 999->14k / 2499->40k
FREE_CHAT_PER_DAY = "20"
FREE_IMAGE_PER_DAY = "3"
FREE_VIDEO_PER_DAY = "1"
# When "true" (default), the RunPod GPU fast-path serves Pro users only.
# Free-tier traffic stays on the $0 Contabo CPU box no matter what.
GPU_PRO_ONLY = "true"
# Legacy single-plan price in INR (old `pro_monthly` clients only).
# New tiers carry their own prices in BILLING_CATALOG; this stays for back-compat.
PRO_PRICE_INR = "299"
# Razorpay Key ID (public; secret goes via `npx wrangler secret put RAZORPAY_KEY_SECRET`).
# Leave empty until you have keys — billing endpoints return 503 and all usage stays free-tier.
# LIVE key (production): set the matching live secret on the worker before deploying.
RAZORPAY_KEY_ID = "rzp_live_TdBXy92OTOoIeh"
#   npx wrangler secret put RAZORPAY_KEY_SECRET

[[kv_namespaces]]
binding = "AUTH_USERS"
id = "eb112976703e4447af69c13dd5f8824c"

[[kv_namespaces]]
binding = "USER_MEMORY"
id = "245e81f7a70c448d840cc399be821633"

# Keep Contabo Ollama warm: Workers cron hits scheduled() every 5 min which
# pings /api/tags (model keep_alive=24h). Without this the model unloads and
# the first user after idle pays a 20-40s cold start / timeout.
[triggers]
crons = ["*/5 * * * *"]
