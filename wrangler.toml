name = "acronous-ai"
compatibility_date = "2026-07-04"
main = "cloudflare-worker.js"

# Worker routes - use separate subdomain for API
routes = [
  { pattern = "api.acronous.com", custom_domain = true },
  { pattern = "ai.acronous.com/*", zone_name = "acronous.com" },
]

[vars]
OPENROUTER_MODEL = "meta-llama/llama-3.3-70b-instruct:free"
VISION_MODEL = "google/gemini-2.5-flash-lite"
FALLBACK_VISION_MODEL = "nvidia/nemotron-nano-12b-v2-vl:free"
FAST_MODEL = "qwen/qwen3-next-80b-a3b-instruct:free"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
ENABLE_WEB = "true"
ENABLE_VISION = "true"
ENABLE_VOICE = "true"
PAGES_ORIGIN = "https://acronous-ai.pages.dev"
# Python image editing service URL — set to your Oracle Cloud image-service
# Example: http://your-oracle-ip:7860 (runs locally with tiny SD model on CPU)
EDITOR_SERVICE_URL = ""

[[kv_namespaces]]
binding = "AUTH_USERS"
id = "eb112976703e4447af69c13dd5f8824c"

[ai]
binding = "AI"