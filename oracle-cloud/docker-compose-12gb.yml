services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-build:/usr/share/nginx/html:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - api-server
      - searxng
    restart: unless-stopped
    networks:
      - acronous-net

  api-server:
    build:
      context: ./oracle-cloud
      dockerfile: Dockerfile.api
    environment:
      - PORT=3000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava:7b}
      - EDITOR_SERVICE_URL=http://image-service:7860
      - SEARXNG_URL=http://searxng:8080
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - acronous-net
    depends_on:
      - ollama
      - searxng

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - acronous-net
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-acronous-searxng-secret-2024}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - acronous-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  image-service:
    build:
      context: ./image-service
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    volumes:
      - ./data:/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava:7b}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    networks:
      - acronous-net
    deploy:
      resources:
        limits:
          memory: 3G

volumes:
  ollama_data:

networks:
  acronous-net:
    driver: bridge
