tunnel: 6ddfa3d9-5330-48a6-9b6f-53b24815a6c5
credentials-file: /home/ubuntu/.cloudflared/6ddfa3d9-5330-48a6-9b6f-53b24815a6c5.json

ingress:
  # Oracle Cloud image-service (Python SD, rembg, Pillow editing, Ollama vision)
  - hostname: image-service.acronous.com
    service: http://localhost:7860
    originRequest:
      noTLSVerify: true
      connectTimeout: 120s
      timeout: 300s

  # Ollama API (text generation + vision) — primary LLM for the worker
  - hostname: ollama.acronous.com
    service: http://localhost:11434
    originRequest:
      noTLSVerify: true
      connectTimeout: 60s
      timeout: 300s

  # SearXNG search engine
  - hostname: search.acronous.com
    service: http://localhost:8080
    originRequest:
      connectTimeout: 15s
      timeout: 60s

  # Nginx (web UI / static files / API)
  - hostname: oracle.acronous.com
    service: http://localhost:80
    originRequest:
      connectTimeout: 10s
      timeout: 60s

  # Catch-all: return 404 for unmatched routes
  - service: http_status:404
