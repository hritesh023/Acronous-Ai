name: Deploy Acronous AI

on:
  push:
    branches: [main, master]
    paths:
      - 'cloudflare-worker.js'
      - 'wrangler.toml'
      - 'lib/**'
      - 'image-service/**'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify worker syntax
        run: node --check cloudflare-worker.js

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy cloudflare-worker.js --name acronous-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy Flutter Frontend
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Build Flutter web
        run: |
          cd Acronous\ Ai
          flutter build web --dart-define="API_BASE_URL=https://ai.acronous.com"
          cp web/_worker.js build/web/_worker.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages/action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: acronous-ai
          directory: Acronous\ Ai/build/web
